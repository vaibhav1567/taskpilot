<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in · TaskPilot</title><link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Newsreader:wght@600&display=swap" rel="stylesheet"><link rel="stylesheet" href="/css/auth.css"><link rel="stylesheet" href="/css/auth-normal.css"></head><body><main class="auth"><div class="brand">Task<span>Pilot</span></div><p class="eyebrow">YOUR LOCAL AI WORKSPACE</p><h1 id="heading">Welcome back</h1><p class="subtitle" id="subtitle">Sign in to continue to your missions.</p><form id="authForm"><label for="email">Email address</label><input id="email" type="email" autocomplete="email" required maxlength="254" placeholder="you@example.com"><label for="password">Password</label><div class="password"><input id="password" type="password" autocomplete="current-password" required placeholder="Your password"><button type="button" id="togglePassword" aria-label="Show password">Show</button></div><p class="hint" id="passwordHint" hidden>Use at least 12 characters.</p><p class="error" id="error" role="alert" aria-live="polite"></p><button class="submit" type="submit" id="submitBtn">Sign in</button></form><p class="switch"><span id="switchText">New to TaskPilot?</span> <button id="switchBtn" type="button">Create account</button></p><p class="privacy">Accounts are stored locally on this computer.</p></main><script src="/js/auth-page.js"></script></body></html>
